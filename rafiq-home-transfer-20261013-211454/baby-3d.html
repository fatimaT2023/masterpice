<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>رفيق — معاينة حركة 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f1e8;color:#123f38;font:16px/1.7 'Segoe UI',sans-serif}header{position:absolute;inset:20px 24px auto;z-index:2;display:flex;justify-content:space-between;gap:20px;pointer-events:none}header a,header div{pointer-events:auto}a{color:inherit}h1{font-size:22px;margin:0}p{margin:4px 0;font-size:13px;max-width:52ch}#scene{width:100%;height:100svh;min-height:500px}canvas{display:block;width:100%;height:100%}.controls{position:fixed;bottom:24px;inset-inline:20px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;z-index:3}button{font:inherit;border:1px solid #adc5b6;border-radius:24px;background:#fffaf0;padding:10px 20px;cursor:pointer;min-height:46px;color:#123f38}button[aria-pressed=true]{background:#123f38;color:#fffaf0}button:focus-visible,a:focus-visible{outline:3px solid #b87540;outline-offset:4px}#status{position:absolute;top:110px;inset-inline:24px;font-size:13px}#error{background:#fff0d8;padding:20px;max-width:550px;margin:140px auto}#error[hidden]{display:none}@media(max-width:600px){header{inset:12px 16px auto}header a{font-size:12px}h1{font-size:18px}header p{max-width:31ch;font-size:12px}.controls{bottom:16px}button{font-size:14px;padding:10px 14px}}
</style></head><body>
<header><div><h1>مختبر حركة رفيق · 3D</h1><p>نموذج بمفاصل لتجربة الحركة. الشكل مبسّط ولا يطابق البيبي النهائي. حرّك الماوس ليحرّك رأسه.</p></div><a href="index.html">العودة للهوم ←</a></header>
<div id="scroll-stage"><div id="scene" role="img" aria-label="شخصية طفل ثلاثية الأبعاد تجلس ثم تحبو أثناء التمرير وتتوقف عند توقفه"></div></div>
<p id="status" role="status">جارٍ تجهيز المشهد…</p><p id="error" hidden>تعذّر تشغيل العرض ثلاثي الأبعاد. افتح الصفحة من السيرفر المحلي وتأكد من دعم WebGL في المتصفح. الهوم الأصلية ما زالت متاحة.</p>
<div class="controls" role="group" aria-label="تحكم بالحركة"><button id="sit" aria-pressed="false">العودة للبداية</button><button id="crawl" aria-pressed="true">الحبو مع السكرول</button><button id="pause" aria-pressed="false">تثبيت الوضعية</button><button id="view" aria-pressed="false">من الجانب</button></div>
<style>#scroll-stage{height:420svh}#scene{position:sticky;top:0}header{position:fixed}#status{position:fixed;pointer-events:none}html{scroll-behavior:auto}.reference{position:fixed;bottom:100px;inset-inline-start:20px;width:92px;background:#fffaf0d9;border:1px solid #d8c9b9;border-radius:14px;padding:8px;text-align:center;z-index:2;font-size:10px}.reference img{display:block;width:100%;height:95px;object-fit:contain}.reference figcaption{line-height:1.5}@media(max-width:600px){.reference{display:none}}</style>
<figure class="reference"><img src="assets/hero/sit-front-cutout.png" alt="البيبي الأصلي كمرجع للمقارنة"><figcaption>الشخصية الأصلية للمقارنة</figcaption></figure>
<script type="module">
import('./baby-3d.js').catch(error=>{document.getElementById('error').hidden=false;document.getElementById('status').textContent='تعذّر تحميل مشهد 3D';console.error(error)});
</script></body></html>
